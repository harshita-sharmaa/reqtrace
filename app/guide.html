<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording Guide</title>
  <style>
    :root {
      --bg: #101418; --panel: #1a2027; --line: #2b333c; --ink: #eef1f4; --muted: #9aa5b1;
      --brand: #5b9bff; --ok: #3ecf75; --warn: #f2b84b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); padding: 14px 16px 20px; }
    h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .tabs button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px; cursor: pointer; font-size: 13px; }
    .tabs button.on { color: var(--ink); border-color: var(--brand); background: #1d2a3d; }
    .clip-title { font-size: 17px; font-weight: 650; margin: 4px 0 2px; }
    .clip-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .start { width: 100%; padding: 10px; border-radius: 8px; border: 0; background: var(--brand); color: #fff; font-weight: 650; font-size: 15px; cursor: pointer; margin-bottom: 12px; }
    .progress { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .progress div { height: 100%; background: var(--ok); transition: width .3s; }
    .count { color: var(--muted); font-size: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .card.now { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 6px; }
    .label.say { color: var(--warn); }
    .label.do { color: var(--brand); }
    .do-text { font-size: 16px; line-height: 1.45; }
    .do-text b { color: #fff; background: #24405f; padding: 0 5px; border-radius: 4px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 0 0 8px; line-height: 1.45; }
    .say-list li { font-size: 16px; }
    .why { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .next { margin-top: 10px; display: flex; gap: 8px; }
    .next button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: #222a33; color: var(--ink); cursor: pointer; }
    .next button.primary { background: var(--ok); color: #08130c; border: 0; font-weight: 700; }
    .done-card { border-color: var(--ok); }
    .muted { color: var(--muted); font-size: 13px; }
    .upnext { opacity: .55; }
    .tip { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 10px; }
    .flash { animation: flash .6s; }
    @keyframes flash { from { box-shadow: 0 0 0 3px var(--ok); } to { box-shadow: 0 0 0 1px var(--brand); } }
  </style>
</head>
<body>
  <h1>Recording guide · Westbridge Purchasing</h1>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
  <script src="guide.js?v=1"></script>
</body>
</html>
